<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond transparent -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Logo centré -->
  <g transform="translate(100, 100)">
    <!-- Orbites atomiques -->
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="url(#gradient1)" stroke-width="3" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="url(#gradient2)" stroke-width="3" opacity="0.8" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="url(#gradient3)" stroke-width="3" opacity="0.8" transform="rotate(120)"/>
    
    <!-- Symbole play central -->
    <polygon points="-8,12 -8,-12 8,0" fill="url(#playGradient)"/>
    
    <!-- Lettre F -->
    <g transform="translate(25, 0)">
      <path d="M-5,-15 L-5,15 M-5,-15 L10,-15 M-5,-2 L5,-2" stroke="url(#fGradient)" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="playGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>