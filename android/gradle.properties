# Augmentation de la mémoire Gradle pour résoudre les erreurs Metaspace
# Solution complète: https://github.com/expo/expo/issues/23720
org.gradle.jvmargs=-Xmx8g -Xms1g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Configuration du daemon Gradle
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4

# Kotlin daemon settings
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Optimisations de build
org.gradle.configuration-on-demand=true

# Android configuration
android.useAndroidX=true
android.enableJetifier=true
