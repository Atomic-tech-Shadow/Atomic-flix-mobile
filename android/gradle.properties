# KSP Memory Leak Fix (2024-2025)
# Solution: https://github.com/google/ksp/issues/2073
# Key: NO MaxMetaspaceSize limit (KSP memory leak), use G1GC
org.gradle.jvmargs=-Xmx8g -Xms1g -Xss8m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Configuration du daemon Gradle
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4

# Kotlin daemon settings - must match main JVM
kotlin.daemon.jvmargs=-Xmx8g -XX:+UseG1GC -Xss8m

# Optimisations de build
org.gradle.configuration-on-demand=true

# Android configuration
android.useAndroidX=true
android.enableJetifier=true
